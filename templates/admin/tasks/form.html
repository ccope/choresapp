{% extends "admin/base.html" %}

{% block title %}{% if task %}Edit Task{% else %}New Task{% endif %}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
    <h2 class="text-3xl font-bold text-gray-800 mb-6">
        {% if task %}Edit Task{% else %}Add New Task{% endif %}
    </h2>

    <form method="POST" action="{% if task %}{{ url_for('admin.update_task', task_id=task.id) }}{% else %}{{ url_for('admin.create_task') }}{% endif %}" class="space-y-6">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                Task Name <span class="text-red-500">*</span>
            </label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                value="{% if task %}{{ task.name }}{% endif %}" 
                required 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                placeholder="Enter task name"
            >
        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                Description
            </label>
            <textarea 
                id="description" 
                name="description" 
                rows="4" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                placeholder="Enter task description"
            >{% if task %}{{ task.description }}{% endif %}</textarea>
        </div>

        <div class="flex items-center justify-end space-x-4">
            <a href="{{ url_for('admin.list_tasks') }}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-6 rounded-lg transition">
                Cancel
            </a>
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-6 rounded-lg transition">
                {% if task %}Update{% else %}Create{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
