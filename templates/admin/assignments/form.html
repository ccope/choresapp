{% extends "admin/base.html" %}

{% block title %}New Assignment{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
    <h2 class="text-3xl font-bold text-gray-800 mb-6">Create New Assignment</h2>

    <form method="POST" action="{{ url_for('admin.create_assignment') }}" class="space-y-6">
        <div>
            <label for="person_id" class="block text-sm font-medium text-gray-700 mb-2">
                Person <span class="text-red-500">*</span>
            </label>
            <select 
                id="person_id" 
                name="person_id" 
                required 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            >
                <option value="">Select a person</option>
                {% for person in people %}
                <option value="{{ person.id }}">{{ person.name }} ({{ person.email }})</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="task_id" class="block text-sm font-medium text-gray-700 mb-2">
                Task <span class="text-red-500">*</span>
            </label>
            <select 
                id="task_id" 
                name="task_id" 
                required 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            >
                <option value="">Select a task</option>
                {% for task in tasks %}
                <option value="{{ task.id }}">{{ task.name }}</option>
                {% endfor %}
            </select>
        </div>

        {% if not people %}
        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
            <p class="text-yellow-800">
                No people available. <a href="{{ url_for('admin.new_person') }}" class="font-medium underline">Add a person</a> first.
            </p>
        </div>
        {% endif %}

        {% if not tasks %}
        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
            <p class="text-yellow-800">
                No tasks available. <a href="{{ url_for('admin.new_task') }}" class="font-medium underline">Add a task</a> first.
            </p>
        </div>
        {% endif %}

        <div class="flex items-center justify-end space-x-4">
            <a href="{{ url_for('admin.list_assignments') }}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-6 rounded-lg transition">
                Cancel
            </a>
            <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-6 rounded-lg transition" {% if not people or not tasks %}disabled{% endif %}>
                Create
            </button>
        </div>
    </form>
</div>
{% endblock %}
