{% extends "admin/base.html" %}

{% block title %}{% if person %}Edit Person{% else %}New Person{% endif %}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
    <h2 class="text-3xl font-bold text-gray-800 mb-6">
        {% if person %}Edit Person{% else %}Add New Person{% endif %}
    </h2>

    <form method="POST" action="{% if person %}{{ url_for('admin.update_person', person_id=person.id) }}{% else %}{{ url_for('admin.create_person') }}{% endif %}" class="space-y-6">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                Name <span class="text-red-500">*</span>
            </label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                value="{% if person %}{{ person.name }}{% endif %}" 
                required 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="Enter person's name"
            >
        </div>

        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                Email <span class="text-red-500">*</span>
            </label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                value="{% if person %}{{ person.email }}{% endif %}" 
                required 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="Enter person's email"
            >
        </div>

        <div class="flex items-center justify-end space-x-4">
            <a href="{{ url_for('admin.list_people') }}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-6 rounded-lg transition">
                Cancel
            </a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition">
                {% if person %}Update{% else %}Create{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
